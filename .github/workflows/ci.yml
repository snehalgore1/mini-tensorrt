name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # arm64 macOS is the project's primary target (see CLAUDE.md): NEON kernels +
    # Apple Accelerate comparison build here. The large real-GPT-2 test skips
    # itself when the gitignored weights are absent, so no Python is needed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
